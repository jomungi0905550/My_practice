<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맵_리듀스_필터함수 연습</title>
</head>
<body>
    <script>
         // 1. 학생 데이터
        const students = [
        { id: 1, name: '김철수', age: 17, grade: 'A', score: 92, subjects: ['수학', '영어'] },
        { id: 2, name: '이영희', age: 16, grade: 'B', score: 78, subjects: ['과학', '영어'] },
        { id: 3, name: '박민수', age: 18, grade: 'A', score: 88, subjects: ['수학', '과학'] },
        { id: 4, name: '최지연', age: 17, grade: 'C', score: 65, subjects: ['영어', '미술'] },
        { id: 5, name: '정다운', age: 16, grade: 'B', score: 81, subjects: ['수학', '체육'] },
        { id: 6, name: '한소희', age: 18, grade: 'A', score: 95, subjects: ['과학', '수학'] },
        { id: 7, name: '오세훈', age: 17, grade: 'D', score: 52, subjects: ['미술', '체육'] },
        { id: 8, name: '윤아름', age: 16, grade: 'B', score: 76, subjects: ['영어', '과학'] },
        ];

        // 2. 상품 데이터
        const products = [
        { id: 101, name: '노트북', category: '전자기기', price: 1500000, stock: 5, rating: 4.5 },
        { id: 102, name: '마우스', category: '전자기기', price: 35000, stock: 50, rating: 4.2 },
        { id: 103, name: '책상', category: '가구', price: 250000, stock: 12, rating: 4.8 },
        { id: 104, name: '의자', category: '가구', price: 180000, stock: 8, rating: 4.0 },
        { id: 105, name: '키보드', category: '전자기기', price: 120000, stock: 0, rating: 4.6 },
        { id: 106, name: '스탠드', category: '가구', price: 45000, stock: 30, rating: 3.9 },
        { id: 107, name: '모니터', category: '전자기기', price: 400000, stock: 15, rating: 4.7 },
        { id: 108, name: '책장', category: '가구', price: 320000, stock: 3, rating: 4.3 },
        ];

        // 3. 주문 데이터
        const orders = [
        { orderId: 1, userId: 'user1', items: [{ name: '노트북', qty: 1, price: 1500000 }], status: '배송완료' },
        { orderId: 2, userId: 'user2', items: [{ name: '마우스', qty: 2, price: 35000 }, { name: '키보드', qty: 1, price: 120000 }], status: '배송중' },
        { orderId: 3, userId: 'user1', items: [{ name: '의자', qty: 1, price: 180000 }], status: '배송완료' },
        { orderId: 4, userId: 'user3', items: [{ name: '책상', qty: 1, price: 250000 }, { name: '스탠드', qty: 2, price: 45000 }], status: '주문접수' },
        { orderId: 5, userId: 'user2', items: [{ name: '모니터', qty: 1, price: 400000 }], status: '배송완료' },
        ];

        // 4. 숫자 배열
        const numbers = [3, 7, 1, 9, 4, 12, 8, 5, 15, 2, 6, 11];

        //filter - 1.학생들을 대상으로 성적이 80점 이상인 학생만 출력하기
        let result = students.filter((v) => (v.score >=80));
        console.log(result);
        
        //filter - 2.수학을 듣는 학생만 출력하기
        let result2 = students.filter((v) =>{
            for(let i =0; i<v.subjects.length; i++){
                if(v.subjects[i] === '수학'){
                    return true;
                }
            }
            return false;
        });
        console.log(result2);
        
        //filter - 3.product 제품에 대해서 재고가 있는 제품만 추출하기
        let result3 = products.filter((v) => (v.stock > 0));
        console.log(result3);

        //filter - 4.전자기기 카테고리 이면서 가격이 20만원인 이하인 애들만 추출하기
        let result4 = products.filter((v) => (v.category ==='전자기기' &&  v.price <= 200000));
        console.log(result4);
        //filter - 5.숫자 배열을 가지고 짝수만 추출하기
        let result5 = numbers.filter((v) => (v%2==0));
        console.log(result5);

        //map - 1.학생 이름만
        let result6 = students.map((v) => v.name);
        console.log(result6);

        //map - 2.숫자 배열의 각 요소를 제곱한 배열
        let result7 = numbers.map((v) => (v*v));
        console.log(result7);

        //map - 3.모든 상품 가격에 부가세(10%) 포함
        let result8 = products.map((v) => v.price * 0.9);
        console.log(result8);

        //map - 4.주문별 총금액을 계산하여 배열 만들기
        let result9 = orders.map(function(v){
            let total = 0;
            for(let i = 0; i<v.items.length; i++){
                total += v.items[i].price * v.items[i].qty;
            }
            return total;
        });
        console.log(result9);

        //reduce - 1.숫자 배열의 합계
        let result10 = numbers.reduce((acc,c) =>acc+c,0);
        console.log(result10);

        //reduce - 2.상품의 총 재고 가치(price * stock 합)
        let result11 = products.reduce((acc,c) => c.price * c.stock,0);
        console.log(result11);

        //reduce - 3.카테고리별 상품 개수 세기
        let result12 = products.reduce((acc, c) => {
            acc[c.category] = (acc[c.category] || 0) + 1;
            return acc;
        },{})
        console.log(result12);

        //reduce - 4.학생들의 평균 점수
        let result13 = students.reduce((acc,c) => acc+c.score,0)/students.length;
        console.log(result13);

        //reduce - 5.최고 점수 학생 찾기
        let result14 = students.reduce((max,c) => max<c.score ? c.score:max,0)
        console.log(result14);

        //A등급 학생들의 평균 점수를 구하여리
        //방식 1
        /*
        let sum = students.reduce((acc,c)=>{
            
            if(c.grade == 'A'){
                acc.total += c.score;
                acc.qty++;
            }
             return acc;
        },{total: 0, qty: 0});

        let result15 = sum.total/sum.qty;
        */
        //방식2
        const a_student =students.filter((v) => v.grade == 'A');
        let result15 = a_student.reduce((total, c) => total+c.score,0)/a_student.length;
        console.log(result15);

        //재고 있는 전자기기의 평균 평점
        //방식1
        /* 
        const stock_product = products.filter((v) => v.category == '전자기기' && v.stock > 0);
        let avg_product = stock_product.reduce((acc, c) =>acc+ c.rating,0)/stock_product.length;
        console.log(avg_product);
        */
        const sum = products.reduce((acc,c) => {
            if(c.category = '전자기기' && c.stock>0){
                acc.rating_sum += c.rating;
                acc.count++;
            }
        },{rating_sum:0, count:0});     
    </script>
